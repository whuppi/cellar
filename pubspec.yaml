name: cellar
version: 1.0.0
description: >-
  Cross-platform file and data storage for Dart and Flutter. Save, read,
  stream, and cache with one API on every platform — auto-cleanup,
  encryption, custom backends.
homepage: https://github.com/whuppi/cellar
repository: https://github.com/whuppi/cellar
issue_tracker: https://github.com/whuppi/cellar/issues

topics:
  - storage
  - cache
  - files
  - encryption
  - cross-platform

environment:
  sdk: ">=3.11.0 <4.0.0"

# Pure Dart on purpose — no Flutter SDK, no plugins. Flutter apps use
# package:cellar_flutter, which resolves storage roots via path_provider
# and re-exports this package.
dependencies:
  # CFURLSetResourcePropertyForKey for iOS backup exclusion — the
  # FileSystemOs seam's FFI calls (macOS uses tmutil; everything else is
  # pure Dart)
  ffi: ^2.1.0

  # Annotations (@immutable, @visibleForTesting)
  meta: ^1.16.0

  # Web APIs — IndexedDB backend + Blob-URL materialization
  web: ^1.1.0

dev_dependencies:
  # Test runner — VM suites and the Chrome web runner both execute
  # under `dart test`
  test: ^1.31.0

  # Lint rules
  lints: ^6.0.0
